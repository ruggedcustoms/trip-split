<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trip Split</title>
<meta name="description" content="Split trip expenses, run polls and chat with your friends.">
<meta name="theme-color" content="#1F5F63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Trip Split">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app — header, trip switcher, scrolling panel, fixed bottom tab bar; bottom sheets for forms */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --sunk:#E9EDE8; --ink:#17262A; --muted:#5E6E70; --line:#D9E0DB;
  --accent:#E8A317; --on-accent:#17262A; --teal:#1F5F63; --on-teal:#FFFFFF;
  --pos:#2B7A4B; --neg:#B5442F; --scrim:rgba(15,26,28,.45);
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A1C; --surface:#172427; --sunk:#1E2E31; --ink:#E8EFEC; --muted:#93A5A3; --line:#2A3B3E;
  --accent:#F2B533; --on-accent:#17262A; --teal:#5BAFB1; --on-teal:#0F1A1C;
  --pos:#6CC08A; --neg:#EE8A73; --scrim:rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1A1C; --surface:#172427; --sunk:#1E2E31; --ink:#E8EFEC; --muted:#93A5A3; --line:#2A3B3E;
  --accent:#F2B533; --on-accent:#17262A; --teal:#5BAFB1; --on-teal:#0F1A1C;
  --pos:#6CC08A; --neg:#EE8A73; --scrim:rgba(0,0,0,.6); color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(96px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 16px}
.brand{font-family:var(--display);font-weight:800;font-size:1.6rem;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand i{width:14px;height:14px;border-radius:50%;background:var(--accent);display:inline-block}
.me{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 .85rem var(--body);cursor:pointer;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h2{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:0;text-wrap:balance}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.num{font-variant-numeric:tabular-nums}
.t{font-weight:600;overflow-wrap:anywhere}
.s{color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.hero{background:var(--teal);color:var(--on-teal);border:0}
.hero .big{font-family:var(--display);font-weight:800;font-size:2.2rem;letter-spacing:-.02em;line-height:1.1}
.hero .label{color:var(--on-teal);opacity:.8}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;border-top:1px solid color-mix(in srgb,var(--on-teal) 25%,transparent);padding-top:10px}
.stats div{display:flex;flex-direction:column;gap:2px;min-width:0}
.stats b{font-size:1rem;font-weight:700;overflow-wrap:anywhere}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:flex-start;padding-block:12px;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:0}
.item:last-child{padding-bottom:0}
.item .main{flex:1;min-width:0}
.amt{font-weight:700;white-space:nowrap}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 16px;font:600 .95rem var(--body);cursor:pointer;background:var(--teal);color:var(--on-teal)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.accent{background:var(--accent);color:var(--on-accent)}
.btn.small{padding:7px 12px;font-size:.82rem;border-radius:10px}
.btn.link{background:none;color:var(--muted);padding:4px 6px;font-weight:500;font-size:.82rem}
.btn.danger{color:var(--neg)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.me:focus-visible,.opt:focus-visible,.tabbar button:focus-visible,.tripbar:focus-visible,.chip:focus-within,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:1.05rem;margin-bottom:4px}
.avatar{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;background:var(--sunk);color:var(--ink)}
.avatar.me-av{background:var(--accent);color:var(--on-accent)}
.settle{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.settle .arrow{color:var(--muted)}
.pill{font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.pill.open,.pill.good{background:color-mix(in srgb,var(--pos) 18%,var(--surface));color:var(--pos)}
.pill.bad{background:color-mix(in srgb,var(--neg) 16%,var(--surface));color:var(--neg)}
/* trips */
.tripbar{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;color:var(--ink);font:inherit;cursor:pointer;text-align:left}
.tripbar .main{display:flex;flex-direction:column;min-width:0}
.tripbar .tn{font-family:var(--display);font-weight:600;font-size:1.05rem;overflow-wrap:anywhere}
.tripbar .sw{color:var(--muted);font-weight:600;font-size:.85rem;white-space:nowrap}
.tripcard{display:flex;flex-direction:column;padding:0;overflow:hidden}
.tripopen{all:unset;box-sizing:border-box;display:block;width:100%;padding:14px 16px 4px;cursor:pointer}
.tripopen:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tripcard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 10px 8px 16px}
.tripcard.current{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.tripname{font-family:var(--display);font-weight:600;font-size:1.1rem;overflow-wrap:anywhere}
.track{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:6px}
.track i{display:block;height:100%;background:var(--accent);border-radius:99px}
/* polls */
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{position:relative;display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 12px;font:500 .95rem var(--body);cursor:pointer;overflow:hidden}
.opt .fill{position:absolute;inset:0 auto 0 0;background:var(--sunk);z-index:0;transition:width .3s}
.opt > span{position:relative;z-index:1;min-width:0;overflow-wrap:anywhere}
.opt.mine{border-color:var(--accent)}
.opt.mine .fill{background:color-mix(in srgb,var(--accent) 28%,var(--surface))}
.opt.win .tx{font-weight:700}
.opt:disabled{cursor:default}
.voters{font-size:.8rem;color:var(--muted);margin-top:2px}
/* chat */
.chat{display:flex;flex-direction:column;gap:6px;padding-bottom:64px}
.day{align-self:center;margin-block:10px 4px}
.msg{display:flex;flex-direction:column;max-width:80%;align-self:flex-start}
.msg.out{align-self:flex-end;align-items:flex-end}
.msg .who{font-size:.75rem;font-weight:600;color:var(--muted);margin:0 10px 2px}
.bubble{background:var(--surface);border:1px solid var(--line);padding:8px 12px;border-radius:16px 16px 16px 4px;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.out .bubble{background:var(--teal);color:var(--on-teal);border-color:transparent;border-radius:16px 16px 4px 16px}
.msg .time{font-size:.7rem;color:var(--muted);margin:2px 10px 0}
.composer{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:8px 16px;display:flex;gap:8px;justify-content:center}
.composer input{flex:1;max-width:460px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:10px 16px;font:500 1rem var(--body);min-width:0}
.composer .btn{border-radius:999px}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:2px;z-index:5}
.tabbar button{flex:1;max-width:120px;min-width:0;border:0;background:none;color:var(--muted);font:600 .72rem var(--body);padding:8px 2px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-selected="true"]{color:var(--ink);background:var(--sunk)}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 6px 18px rgba(0,0,0,.18);border-radius:999px;padding:13px 20px}
@media (min-width:600px){.fab{right:calc(50% - 264px)}}
/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.opt .fill{transition:none}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
textarea{width:100%;min-height:84px;resize:vertical;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:11px 12px;font:500 1rem var(--body)}
textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dispute{margin-top:8px;background:color-mix(in srgb,var(--neg) 10%,var(--surface));color:var(--ink);border-radius:10px;padding:8px 10px;font-size:.85rem;display:flex;flex-direction:column;gap:2px}
.dispute .who{font-weight:700;color:var(--neg)}
.dispute .btn.link{align-self:flex-start;padding:2px 0;color:var(--ink);font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px}
.acts .btn.link{padding:4px 0}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 10px;font:500 .82rem var(--body);cursor:pointer}
.ac{position:relative}
.ac-list{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:2;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,.16);max-height:240px;overflow:auto;padding:4px;display:flex;flex-direction:column}
.ac-list button{all:unset;box-sizing:border-box;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:.95rem;color:var(--ink);overflow-wrap:anywhere}
.ac-list button.hi,.ac-list button:hover{background:var(--sunk)}
.ac-list button.custom{color:var(--teal);border-top:1px solid var(--line);border-radius:0 0 8px 8px}
.ac-list button.custom:first-child{border-top:0;border-radius:8px}
.summary{background:var(--sunk);border-radius:10px;padding:10px 12px}
input[type=text],input[type=email],input[type=number],input[type=date],select{width:100%;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:11px 12px;font:500 1rem var(--body)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:500;font-size:.9rem}
.chip input{accent-color:var(--teal);margin:0}
.chip:has(input:checked){border-color:var(--teal);background:var(--sunk)}
.inline{display:flex;gap:8px}
.inline > *{flex:1;min-width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.9rem;z-index:20;max-width:calc(100% - 32px);text-align:center}
.banner{background:var(--sunk);border-radius:var(--r);padding:12px 14px;font-size:.9rem}
.hint{color:var(--muted);font-size:.82rem}
html,body{margin:0}
body{font-size:15px}
[hidden]{display:none!important}
.gate{min-height:70vh;display:grid;place-items:center;text-align:center}
.gate .card{max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px}
a.btn{text-decoration:none;display:inline-block;text-align:center}
.offline{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:30;background:var(--neg);color:#fff;padding:6px 12px;border-radius:999px;font-size:.8rem;font-weight:700}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><i></i>Trip Split</div>
    <button class="me" id="meBtn" type="button" hidden></button>
  </header>
  <main id="view"></main>
</div>
<button class="btn accent fab" id="fab" type="button" hidden></button>
<form class="composer" id="composer" hidden>
  <input type="text" id="msgInput" placeholder="Message the trip" maxlength="500" autocomplete="off" aria-label="Message">
  <button class="btn" type="submit" id="sendBtn">Send</button>
</form>
<nav class="tabbar" role="tablist" id="tabbar" hidden>
  <button role="tab" data-tab="home" id="tab-home"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="9" rx="1.5"/><rect x="13" y="4" width="7" height="5" rx="1.5"/><rect x="13" y="11" width="7" height="9" rx="1.5"/><rect x="4" y="15" width="7" height="5" rx="1.5"/></svg>Dashboard</button>
  <button role="tab" data-tab="money" id="tab-money"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg>Expenses</button>
  <button role="tab" data-tab="polls" id="tab-polls"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Polls</button>
  <button role="tab" data-tab="chat" id="tab-chat"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>Chat</button>
  <button role="tab" data-tab="group" id="tab-group"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c.6-3.2 3-5 6-5s5.4 1.8 6 5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2c2.6 0 4.4 1.6 5 4.3"/></svg>Friends</button>
</nav>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>
<div id="offline" class="offline" hidden>Offline</div>
<script src="/app.js"></script>
</body>
</html>
