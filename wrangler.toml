# Trip Split — Cloudflare configuration
# Fill in the four values marked "CHANGE ME" (the README walks you through each one).

name = "trip-split"
main = "src/worker.js"
compatibility_date = "2025-06-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "trip-split"
database_id = "21b8b57b-99cc-44f9-a181-b4bcd4874fa7"          # from: npx wrangler d1 create trip-split

[vars]
ADMIN_EMAIL = "info@ruggedcustoms.com"           # your own email: the organizer
ACCESS_TEAM_DOMAIN = "https://CHANGE-ME.cloudflareaccess.com"   # your Zero Trust team domain
ACCESS_AUD = "REPLACE-with-application-audience-tag"           # the Access app's AUD tag
