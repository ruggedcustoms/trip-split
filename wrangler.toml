# Trip Split — Cloudflare configuration
# The README walks you through each value.

name = "trip-split"
main = "server/worker.js"
compatibility_date = "2025-06-01"

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "trip-split"
database_id = "21b8b57b-99cc-44f9-a181-b4bcd4874fa7"          # from: npx wrangler d1 create trip-split

[vars]
ADMIN_EMAIL = "info@ruggedcustoms.com"           # identifies the organizer's account; not used to send email

# Passwords are Cloudflare secrets, not stored here (this file is public):
#   npx wrangler secret put GROUP_PASSWORD    (what friends type)
#   npx wrangler secret put ADMIN_PASSWORD    (what the organizer types)
#   npx wrangler secret put SESSION_SECRET    (any long random text)
